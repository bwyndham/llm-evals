[project]
name = "llm-evals"
version = "0.1.0"
description = "Paired regression evals for LLM features with a PROMOTE / HOLD / ROLLBACK gate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ben Wyndham", email = "46075311+bwyndham@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "gherkin-official>=42.0.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/bwyndham/llm-evals"
Documentation = "https://github.com/bwyndham/llm-evals/blob/main/docs/adopting.md"

[project.scripts]
# `llm-evals` is the name to use in a shell; `eval` is kept for this repo's own
# scripts, run through `uv run` (in a plain shell, bash's built-in eval wins).
llm-evals = "llm_evals.cli.main:app"
eval = "llm_evals.cli.main:app"

[tool.pytest.ini_options]
markers = ["slow: long-running simulation tests"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
